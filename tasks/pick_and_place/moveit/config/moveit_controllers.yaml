# MoveIt executes through this plugin, which expects the FollowJointTrajectory
# server named below: bridge_node.
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  # Merged MTC trajectories arrive with time_from_start == 0 throughout, so
  # move_group's own duration watchdog would cancel them at ~0.5 s.
  # bridge_node retimes them and enforces its own timeout; this margin just
  # keeps move_group's watchdog from firing first.
  allowed_goal_duration_margin: 30.0
  allowed_start_tolerance: 0.01
  trajectory_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - panda_arm_controller

  panda_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
